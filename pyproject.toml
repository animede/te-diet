[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tediet"
version = "0.1.0"
description = "Output-exact VRAM reducers for diffusion-pipeline text encoders: CPU-bridged embeddings, LM-head skip, and ring-buffered layer streaming"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "animede" }]
dependencies = ["torch>=2.1"]
keywords = ["diffusers", "vram", "offloading", "text-encoder", "diffusion"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/animede/te-diet"

[tool.setuptools.packages.find]
where = ["src"]
